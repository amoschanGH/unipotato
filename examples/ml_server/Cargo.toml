[package]
name    = "ml_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio           = { version = "1", features = ["full"] }
unipotato       = { version = "0.1.3" }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
rustpy-ml       = { path = "../../../rustpy-ml", features = ["async"] }
once_cell       = "1"
base64          = "0.21"
ctrlc           = "3"
pyo3            = { version = "0.23", features = ["auto-initialize"] }
