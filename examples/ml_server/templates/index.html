<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{ title }</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6ec;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 460px;
    }
    h1 { font-size: 2rem; color: #ff6b35; margin-bottom: .5rem; }
    p  { color: #555; line-height: 1.6; margin-top: .75rem; }
    .badge {
      display: inline-block;
      background: #ff6b35;
      color: #fff;
      border-radius: 999px;
      padding: .25rem .8rem;
      font-size: .8rem;
      margin-top: 1.25rem;
      font-weight: 600;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🥔 {{ title }}</h1>
    <p>Welcome to <strong>ml_server</strong>, a Unipotato web server.</p>
    <p>Edit <code>templates/index.html</code> and <code>src/handlers/template.rs</code>
       to customise this page.</p>
    <span class="badge">powered by Unipotato</span>
  </div>
</body>
</html>
