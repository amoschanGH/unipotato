[package]
name = "unipotato"
version = "0.1.0"
edition = "2024"
description = "A macro-based Rust backend framework for AI integration"
authors = ["CHAN, Hin Chung <chanhinchung334@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/amoschanGH/unipotato"

[dependencies]
tokio = {version = "1.40.0", features = ["full"]}
hyper = {version = "1.7.0", features = ["full"]}
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
syn = { version = "2.0.109", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
futures-util = "0.3"
http-body-util = "0.1"

[[example]]
name = "simple_server"
path = "examples/simple_server.rs"
