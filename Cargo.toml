[package]
name = "unipotato"
version = "0.1.2"
edition = "2024"
description = "A macro-based Rust backend framework for AI integration"
authors = ["CHAN, Hin Chung <chanhinchung334@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/amoschanGH/unipotato"

[dependencies]
tokio = {version = "1.40.0", features = ["full"]}
hyper = {version = "1.7.0", features = ["full"]}
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
syn = { version = "2.0.110", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
http-body-util = "0.1"
unipotato-macros = { version = "0.1.1" }
ctor = "0.6"
once_cell = "1.19"
chrono = "0.4"
paste = "1.0"
urlencoding = "2.1"
regex = "1"
notify = "8.2"

[[example]]
name = "simple_server"
path = "examples/simple_server/main.rs"

